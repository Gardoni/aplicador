<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALIACAO - Prova Online</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1a1a1a;padding:16px;border-radius:16px;max-width:850px;margin:10px auto;text-align:left;border:1px solid #333}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;font-size:15px;box-sizing:border-box;background:#fff;color:#000}
button{border:none;padding:9px 14px;font-weight:800;border-radius:30px;margin:3px;cursor:pointer;font-size:11px}
.btn-go{background:#00ff88;color:#000}.btn-blue{background:#2962ff;color:#fff}.btn-red{background:#b71c1c;color:#fff}.btn-excel{background:#00c853;color:#fff}.btn-sec{background:#333;color:#fff}.btn-edit{background:#ffca28;color:#000}
.tab{display:flex;max-width:850px;margin:10px auto;background:#222;border-radius:30px;padding:4px}
.tab button{flex:1;background:transparent;color:#888;padding:12px}.tab button.active{background:#00ff88;color:#000}
.q-card{background:#222;padding:16px;border-radius:12px;margin:12px 0;border:1px solid #333;text-align:left}
.q-pergunta{font-size:15px;font-weight:700;margin-bottom:10px;color:#fff}
.q-alt{padding:10px 12px;margin:6px 0;background:#111;border:2px solid #444;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.q-alt:hover{border-color:#00ff88}
.q-alt.sel{background:#00ff88;color:#000;border-color:#00ff88;font-weight:800}
.letra{width:32px;height:32px;background:#333;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
</style>
</head>
<body>
<h2 style="color:#00ff88">📝 APLICADOR - PROVA ONLINE</h2>
<div id="statusFirebase" style="font-size:12px;color:#888">Conectando...</div>
<div class="tab">
  <button id="tabProf" class="active" onclick="showTab('prof')">👨‍🏫 PROFESSOR</button>
  <button id="tabAluno" onclick="showTab('aluno')">👨‍🎓 ALUNO</button>
</div>
<div id="loginProf" class="card" style="max-width:420px">
  <h3 style="text-align:center;color:#00ff88">🔒 LOGIN PROFESSOR</h3>
  <input id="profNome" placeholder="Usuário"><input id="profSenha" type="password" placeholder="Senha">
  <button class="btn-go" onclick="loginProfessor()" style="width:100%;padding:14px">ENTRAR</button>
  <p id="msgLogin" style="text-align:center;color:#ff5252"></p>
</div>
<div id="areaProf" style="display:none">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><h3 style="color:#00ff88;margin:0">Prof: <span id="nomeProfLogado"></span></h3><small id="idProfLogado"></small></div>
    <button class="btn-red" onclick="sair()">SAIR</button>
  </div>
  <div class="card">
    <h3 style="color:#00ff88" id="tituloFormSala">+ Nova Prova Online</h3>
    <input id="nomeProva" placeholder="Ex: 2º ANO - FATORIAL">
    <input id="senhaUnica" placeholder="CÓDIGO: MAT2A">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><small>INÍCIO</small><input id="dataInicio" type="datetime-local"></div><div><small>FIM</small><input id="dataFim" type="datetime-local"></div></div>
    <textarea id="textoQuestoes" rows="14" placeholder="Cole as questões..."></textarea>
    <button class="btn-edit" onclick="carregarProva2Ano()" style="width:100%">📚 CARREGAR SUA PROVA DO 2º ANO (10 Q)</button>
    <div id="previewArea"></div>
    <button class="btn-go" onclick="salvarProva()" style="width:100%;margin-top:10px" id="btnSalvarSala">💾 SALVAR PROVA ONLINE</button>
  </div>
  <div class="card"><h3>Minhas Provas (<span id="totalSalas">0</span>)</h3><div id="listaProvas"></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between"><h3>Resultados</h3><select id="filtroSala" onchange="renderRes()"></select></div><div id="tabRes"></div><button class="btn-excel" onclick="baixar()" style="width:100%">📊 BAIXAR EXCEL</button></div>
</div>
<div id="areaAluno" style="display:none">
  <div id="alunoLogin" class="card" style="max-width:420px">
    <h3 style="color:#2962ff;text-align:center">👨‍🎓 ALUNO</h3>
    <input id="alunoLoginInput" placeholder="Seu nome">
    <button class="btn-blue" onclick="loginAlunoSimples()" style="width:100%">ENTRAR</button>
    <p id="msgAluno" style="color:#ff5252;text-align:center"></p>
    <div style="margin-top:15px;border-top:1px solid #333;padding-top:10px">
      <input id="codigoProvaAluno" placeholder="Código ex: MAT2A">
      <button class="btn-go" onclick="abrirProvaComCodigo()" style="width:100%;padding:14px">📝 ABRIR PROVA ONLINE</button>
      <div id="listaCodigosDisponiveis" style="font-size:10px;color:#666;margin-top:8px"></div>
    </div>
  </div>
  <div id="areaProva" class="card" style="display:none"><h3 id="titProva"></h3><p id="infoAl"></p><div id="cronometro" style="font-size:20px;color:#00ff88;font-weight:900;text-align:center;background:#000;padding:8px;border-radius:10px">⏰ --:--:--</div><div id="listaQuestoesAluno"></div><button class="btn-go" onclick="enviar()" style="width:100%;margin-top:20px;padding:16px">✅ FINALIZAR</button></div>
  <div id="resAl" class="card" style="display:none"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM", authDomain: "testeapi-1ad07.firebaseapp.com", projectId: "testeapi-1ad07", storageBucket: "testeapi-1ad07.firebasestorage.app", messagingSenderId: "323295128076", appId: "1:323295128076:web:3af167424f75b680f19c29" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let profLogado=null, provas=[], resultados=[], provaAtual=null, respostas=[], timerInterval=null, editandoSalaId=null, alunoLogado=null, questoesAtuais=[];
window.todasProvas=[];
const ADMIN_USER = "gardoni";
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'_');}
function parseDataLocal(str){ if(!str) return null; try{ let [data, hora] = str.split('T'); let [ano, mes, dia] = data.split('-').map(Number); let [h, m] = hora.split(':').map(Number); return new Date(ano, mes-1, dia, h, m); }catch{ return new Date(str); } }
const PROVA_2ANO = [
  {pergunta:"O que significa 4! (4 fatorial)?", A:"4+3+2+1", B:"4 x 4 x 4 x 4", C:"4 x 3 x 2 x 1", D:"4 + 4", gab:"C"},
  {pergunta:"Quanto vale 2! + 3!", A:"5!", B:"5", C:"8", D:"10", gab:"C"},
  {pergunta:"Simplifique: 7! / 6!", A:"1", B:"7", C:"42", D:"6", gab:"B"},
  {pergunta:"Quantos números de 4 algarismos diferentes pode formar com 1,2,3,4?", A:"24", B:"12", C:"4", D:"16", gab:"A"},
  {pergunta:"Quantos anagramas tem a palavra LIVRO?", A:"25", B:"120", C:"60", D:"10", gab:"B"},
  {pergunta:"Quantas senhas de 3 letras diferentes posso fazer com A,B,C?", A:"6", B:"9", C:"3", D:"27", gab:"A"},
  {pergunta:"Em um grupo de 8 alunos, escolher 3 para apresentar. Quantas formas?", A:"24", B:"56", C:"336", D:"8", gab:"B"},
  {pergunta:"De quantas formas 5 pessoas podem ocupar 3 cadeiras (ordem importa)?", A:"60", B:"10", C:"15", D:"125", gab:"A"},
  {pergunta:"Quantas placas com duas letras diferentes (A,B,C,D,E) e 2 números diferentes (0 até 9) podemos formar?", A:"2000", B:"1800", C:"100", D:"200", gab:"B"},
  {pergunta:"Em um jogo, existem 25 números disponíveis, e cada cartão deve ser preenchido com 15 números diferentes. Considerando que a ordem dos números não importa, quantos cartões diferentes podem ser formados?", A:"15!/25!", B:"25!/(15! x 10!)", C:"15!/(25! x 10!)", D:"25!/10!", gab:"B"},
];
window.carregarProva2Ano = function(){ let txt = ""; PROVA_2ANO.forEach((q,i)=>{ txt += `${i+1}) ${q.pergunta}\nA) ${q.A}\nB) ${q.B}\nC) ${q.C}\nD) ${q.D}\nGAB: ${q.gab}\n\n`; }); document.getElementById('textoQuestoes').value = txt; previewQuestoes(); }
function parseQuestoesDoTexto(texto){ let questoes = []; let blocos = texto.split(/\n\s*\n/); if(blocos.length < 2) blocos = texto.split(/\n(?=\d+\))/); blocos.forEach(bloco=>{ bloco = bloco.trim(); if(!bloco) return; let linhas = bloco.split('\n').map(l=>l.trim()).filter(l=>l); if(linhas.length < 2) return; let pergunta = linhas[0].replace(/^\d+\)\s*/, '').trim(); let q = {pergunta: pergunta, A:"", B:"", C:"", D:"", gab:"A"}; linhas.forEach(l=>{ let m = l.match(/^A\)\s*(.*)/i); if(m) q.A = m[1]; m = l.match(/^B\)\s*(.*)/i); if(m) q.B = m[1]; m = l.match(/^C\)\s*(.*)/i); if(m) q.C = m[1]; m = l.match(/^D\)\s*(.*)/i); if(m) q.D = m[1]; m = l.match(/GAB:\s*([A-D])/i); if(m) q.gab = m[1].toUpperCase(); }); if(q.A && q.B) questoes.push(q); }); return questoes; }
window.previewQuestoes = function(){ let texto = document.getElementById('textoQuestoes').value; let qs = parseQuestoesDoTexto(texto); questoesAtuais = qs; let html = `<h4 style="color:#00ff88">${qs.length} questões detectadas</h4>`; qs.forEach((q,i)=>{ html += `<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px"><b>${i+1}) ${q.pergunta} [${q.gab}]</b><br><small>A) ${q.A} | B) ${q.B} | C) ${q.C} | D) ${q.D}</small></div>`; }); document.getElementById('previewArea').innerHTML = html; }
async function carregarSalasParaAluno(){ try{ let snap=await getDocs(collection(db,"provas")); window.todasProvas=[]; snap.forEach(d=>window.todasProvas.push(d.data())); document.getElementById('statusFirebase').innerText="✅ "+window.todasProvas.length+" provas online"; document.getElementById('listaCodigosDisponiveis').innerText="Códigos: "+window.todasProvas.map(p=>p.senha).join(', '); }catch(e){ document.getElementById('statusFirebase').innerText="❌ "+e.message; } }
window.showTab = function(t){ if(t=='prof'){if(!profLogado){loginProf.style.display='block'; areaProf.style.display='none';}else{loginProf.style.display='none'; areaProf.style.display='block';} areaAluno.style.display='none';} else{areaAluno.style.display='block'; areaProf.style.display='none'; loginProf.style.display='none'; carregarSalasParaAluno();} tabProf.classList.toggle('active', t=='prof'); tabAluno.classList.toggle('active', t=='aluno'); }
window.loginAlunoSimples = function(){ let login = document.getElementById('alunoLoginInput').value.trim(); if(login.length < 2){ document.getElementById('msgAluno').innerText="Digite seu nome"; return; } alunoLogado = {login: login, id: norm(login)}; document.getElementById('msgAluno').innerText = "✅ Olá "+login+"! Agora digite o código"; }
window.loginProfessor = async function(){ let u=profNome.value.trim(), s=profSenha.value.trim(); let id=norm(u); if(!u||!s){msgLogin.innerText="Preencha";return;} let snap=await getDoc(doc(db,"professores",id)); if(id===ADMIN_USER &&!snap.exists()){await setDoc(doc(db,"professores",ADMIN_USER),{id:ADMIN_USER, usuario:"gardoni", senha:"Rga@193319", isAdmin:true, timestamp:Date.now()}); snap=await getDoc(doc(db,"professores",ADMIN_USER));} if(!snap.exists()){msgLogin.innerText="Não encontrado";return;} let dados=snap.data(); if(dados.senha!=s){msgLogin.innerText="Senha errada";return;} profLogado=dados; localStorage.setItem('prof_logado', JSON.stringify(profLogado)); nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id; loginProf.style.display='none'; areaProf.style.display='block'; carregarDaNuvem(); }
window.sair = function(){profLogado=null; localStorage.removeItem('prof_logado'); areaProf.style.display='none'; loginProf.style.display='block';}
async function carregarDaNuvem(){ if(!profLogado) return; let snapProvas=await getDocs(collection(db,"provas")); provas=[]; snapProvas.forEach(d=>{let p=d.data(); if(p.professorId==profLogado.id) provas.push(p);}); let snapRes=await getDocs(collection(db,"resultados")); let meusIds=new Set(provas.map(p=>p.id)); resultados=[]; snapRes.forEach(d=>{let r=d.data(); if(meusIds.has(r.provaId)) resultados.push(r);}); renderSalas(); renderRes(); await carregarSalasParaAluno(); }
window.salvarProva = async function(){ let nome=nomeProva.value.trim(), senha=senhaUnica.value.trim(), ini=dataInicio.value, fim=dataFim.value; if(!nome||!senha||!ini||!fim){alert("Preencha nome, código, início e fim");return;} let texto = document.getElementById('textoQuestoes').value; let qs = parseQuestoesDoTexto(texto); if(qs.length==0){alert("Nenhuma questão!");return;} let id=`${profLogado.id}_${norm(senha)}`; let obj={ id:id, nome:nome, senha:senha, inicio:ini, fim:fim, qtd:qs.length, gabarito:qs.map(q=>q.gab), questoes:qs, professorId:profLogado.id, professorNome:profLogado.usuario, timestamp:Date.now(), tipo:"online" }; await setDoc(doc(db,"provas",id),obj,{merge:true}); alert(`✅ Prova salva! ${qs.length} questões | Código: ${senha}`); await carregarDaNuvem(); }
function renderSalas(){ let div=listaProvas; document.getElementById('totalSalas').innerText=provas.length; if(!provas.length){div.innerHTML='<small>Nenhuma</small>';return;} let filtro=document.getElementById('filtroSala'); filtro.innerHTML='<option value="TODAS">TODAS</option>' + provas.map(p=>`<option value="${p.id}">${p.nome} (${p.senha})</option>`).join(''); div.innerHTML=provas.map(p=>`<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><b style="color:#00ff88">${p.nome}</b> <span style="background:#00ff88;color:#000;padding:2px 6px;border-radius:10px;font-size:10px">${p.qtd}q</span><br><small>Código: <b style="color:#ffeb3b">${p.senha}</b></small></div><div><button class="btn-red" onclick="apagarSala('${p.id}')">🗑️</button></div></div></div>`).join(''); }
window.apagarSala = async function(id){if(!confirm("Apagar?"))return; await deleteDoc(doc(db,"provas",id)); await carregarDaNuvem();}
window.abrirProvaComCodigo = async function(){ if(!alunoLogado){alert("Digite seu nome");return;} let codigo=codigoProvaAluno.value.trim().toLowerCase(); let p=window.todasProvas.find(x=> x.senha.trim().toLowerCase() == codigo); if(!p){alert("Código não encontrado");return;} let agora=new Date(); let ini=parseDataLocal(p.inicio); let fim=parseDataLocal(p.fim); if(agora < ini){alert(`Ainda não começou`);return;} if(agora > fim){alert(`Encerrada`);return;} provaAtual=p; respostas=new Array(p.qtd).fill(''); titProva.innerText=`${p.nome}`; infoAl.innerText=`Aluno: ${alunoLogado.login}`; let htmlQ = ""; p.questoes.forEach((q,i)=>{ htmlQ += `<div class="q-card"><div class="q-pergunta">${i+1}) ${q.pergunta}</div><div class="q-alt" id="q${i}A" onclick="marcar(${i},'A')"><span class="letra">A</span><span>${q.A}</span></div><div class="q-alt" id="q${i}B" onclick="marcar(${i},'B')"><span class="letra">B</span><span>${q.B}</span></div><div class="q-alt" id="q${i}C" onclick="marcar(${i},'C')"><span class="letra">C</span><span>${q.C}</span></div><div class="q-alt" id="q${i}D" onclick="marcar(${i},'D')"><span class="letra">D</span><span>${q.D}</span></div></div>`; }); document.getElementById('listaQuestoesAluno').innerHTML = htmlQ; document.getElementById('alunoLogin').style.display='none'; areaProva.style.display='block'; if(timerInterval) clearInterval(timerInterval); timerInterval=setInterval(()=>{let d=fim-new Date(); if(d<=0){clearInterval(timerInterval); enviar(); return;} let h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000); cronometro.innerText=`⏰ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000); }
window.marcar = function(q,l){ respostas[q]=l; ['A','B','C','D'].forEach(x=>{ let el = document.getElementById(`q${q}${x}`); if(el) el.classList.toggle('sel',x==l); }); }
window.enviar = async function(){ if(timerInterval) clearInterval(timerInterval); let ac=0; for(let i=0;i<provaAtual.qtd;i++) if(respostas[i]==provaAtual.questoes[i].gab) ac++; let perc=(ac/provaAtual.qtd*100).toFixed(1); let idResultado=`${provaAtual.id}_${norm(alunoLogado.login)}_${Date.now()}`; let novo={ id:idResultado, provaId:provaAtual.id, provaNome:provaAtual.nome, professorId:provaAtual.professorId, professorNome:provaAtual.professorNome, nome:alunoLogado.login.toUpperCase(), loginAluno:alunoLogado.login, acertos:ac, total:provaAtual.qtd, nota:perc, respostas:respostas.join(','), gabarito:provaAtual.questoes.map(q=>q.gab).join(','), data:new Date().toLocaleString(), timestamp:Date.now() }; await setDoc(doc(db,"resultados",idResultado),novo,{merge:true}); areaProva.style.display='none'; resAl.style.display='block'; resAl.innerHTML=`<h3 style="color:#00ff88">✅ Enviado!</h3><b style="font-size:24px">${ac}/${provaAtual.qtd} = ${perc}%</b><br><br><button class="btn-sec" onclick="location.reload()" style="width:100%;padding:14px">🚪 SAIR</button>`; }
window.renderRes = function(){ let div=tabRes; let filtro=document.getElementById('filtroSala')?.value || "TODAS"; let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro); if(!lista.length){div.innerHTML='<small>Nenhum</small>';return;} let ord=[...lista].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)); div.innerHTML=`<table><tr><th>ALUNO</th><th>NOTA</th><th>RESP</th><th></th></tr>`+ord.map(r=>`<tr><td><b>${r.nome}</b></td><td>${r.acertos}/${r.total}<br><b style="color:#00ff88">${r.nota}%</b></td><td style="font-size:10px">${r.respostas}</td><td><button class="btn-red" onclick="apagarResultado('${r.id}')">🗑️</button></td></tr>`).join('')+`</table>`; }
window.apagarResultado = async function(id){if(!confirm("Apagar?"))return; await deleteDoc(doc(db,"resultados",id)); await carregarDaNuvem();}
window.baixar = function(){ let filtro=document.getElementById('filtroSala')?.value || "TODAS"; let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro); if(!lista.length){alert('Vazio');return;} let csv='PROFESSOR;PROVA;ALUNO;ACERTOS;TOTAL;NOTA;RESPOSTAS;GABARITO;DATA\n'; lista.forEach(r=>csv+=`${r.professorNome};${r.provaNome};${r.loginAluno};${r.acertos};${r.total};${r.nota}%;${r.respostas};${r.gabarito};${r.data}\n`); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`RESULTADOS.csv`; a.click(); }
let salvo=localStorage.getItem('prof_logado'); if(salvo){try{profLogado=JSON.parse(salvo); nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id; loginProf.style.display='none'; areaProf.style.display='block'; carregarDaNuvem();}catch{}} carregarSalasParaAluno();
</script>
</body>
</html>
